<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>칼로리 트래커</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f; --surface: #13131a; --surface2: #1c1c26;
    --accent: #c8f135; --text: #f0f0f0; --muted: #6b6b80;
    --border: #2a2a38; --danger: #ff4444; --success: #44ff88;
  }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  body { background:var(--bg); color:var(--text); font-family:'Noto Sans KR',sans-serif; min-height:100vh; max-width:480px; margin:0 auto; overflow-x:hidden; }

  .header { padding:16px 20px 12px; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; background:var(--bg); z-index:100; border-bottom:1px solid var(--border); }
  .logo { font-family:'Bebas Neue',sans-serif; font-size:26px; letter-spacing:2px; color:var(--accent); }
  .date-badge { font-size:12px; color:var(--muted); background:var(--surface); padding:4px 10px; border-radius:20px; }

  .tabs { display:flex; border-bottom:1px solid var(--border); background:var(--bg); position:sticky; top:53px; z-index:99; }
  .tab { flex:1; padding:11px; text-align:center; font-size:13px; color:var(--muted); cursor:pointer; border-bottom:2px solid transparent; transition:all 0.2s; font-weight:500; }
  .tab.active { color:var(--accent); border-bottom-color:var(--accent); }

  .page { display:none; padding:16px; }
  .page.active { display:block; }
  #page-scan { padding:0; }

  /* TODAY */
  .goal-section { background:var(--surface); border-radius:20px; padding:20px; margin-bottom:16px; display:flex; align-items:center; gap:20px; }
  .ring-wrap { position:relative; width:96px; height:96px; flex-shrink:0; }
  .ring-svg { width:96px; height:96px; transform:rotate(-90deg); }
  .ring-bg { fill:none; stroke:var(--border); stroke-width:8; }
  .ring-fill { fill:none; stroke-width:8; stroke-linecap:round; transition:stroke-dashoffset 0.6s ease; }
  .ring-center { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .ring-cal { font-family:'Bebas Neue',sans-serif; font-size:20px; line-height:1; }
  .ring-label { font-size:10px; color:var(--muted); }
  .goal-info { flex:1; }
  .goal-title { font-size:12px; color:var(--muted); margin-bottom:4px; }
  .goal-numbers { font-family:'Bebas Neue',sans-serif; font-size:30px; line-height:1; }
  .goal-sub { font-size:12px; color:var(--muted); margin-top:3px; }
  .over-badge { display:inline-block; background:var(--danger); color:#fff; font-size:11px; padding:2px 8px; border-radius:10px; font-weight:700; margin-top:4px; }
  .ok-badge   { display:inline-block; background:var(--success); color:#000; font-size:11px; padding:2px 8px; border-radius:10px; font-weight:700; margin-top:4px; }
  .macros { display:flex; gap:8px; margin-bottom:16px; }
  .macro-card { flex:1; background:var(--surface); border-radius:14px; padding:12px; text-align:center; }
  .macro-val { font-family:'Bebas Neue',sans-serif; font-size:20px; }
  .macro-lbl { font-size:11px; color:var(--muted); }
  .section-title { font-size:11px; color:var(--muted); font-weight:700; letter-spacing:1px; text-transform:uppercase; margin-bottom:10px; }
  .food-item { background:var(--surface); border-radius:14px; padding:12px 14px; margin-bottom:8px; display:flex; align-items:center; gap:12px; }
  .food-emoji { font-size:22px; width:32px; text-align:center; }
  .food-info { flex:1; }
  .food-name { font-size:14px; font-weight:500; }
  .food-time { font-size:11px; color:var(--muted); }
  .food-cal { font-family:'Bebas Neue',sans-serif; font-size:20px; color:var(--accent); }
  .food-kcal { font-size:10px; color:var(--muted); }
  .btn-del { background:none; border:none; color:var(--muted); font-size:17px; cursor:pointer; padding:4px; }
  .empty-log { text-align:center; padding:30px; color:var(--muted); font-size:13px; }

  /* LIVE SCAN */
  .live-wrap { position:relative; width:100%; height:calc(100vh - 96px); background:#000; overflow:hidden; }
  #liveVideo { width:100%; height:100%; object-fit:cover; }
  #snapCanvas { display:none; }
  .scan-frame { position:absolute; top:50%; left:50%; transform:translate(-50%,-58%); width:68%; max-width:250px; aspect-ratio:1; border:1.5px solid rgba(200,241,53,0.4); border-radius:16px; pointer-events:none; }
  .sf-tl,.sf-tr,.sf-bl,.sf-br { position:absolute; width:18px; height:18px; border-color:var(--accent); border-style:solid; }
  .sf-tl { top:-2px; left:-2px; border-width:3px 0 0 3px; border-radius:4px 0 0 0; }
  .sf-tr { top:-2px; right:-2px; border-width:3px 3px 0 0; border-radius:0 4px 0 0; }
  .sf-bl { bottom:-2px; left:-2px; border-width:0 0 3px 3px; border-radius:0 0 0 4px; }
  .sf-br { bottom:-2px; right:-2px; border-width:0 3px 3px 0; border-radius:0 0 4px 0; }
  .scan-line { position:absolute; left:4px; right:4px; height:2px; background:linear-gradient(90deg,transparent,var(--accent),transparent); animation:scanLine 2.2s ease-in-out infinite; top:8%; }
  @keyframes scanLine { 0%{top:8%;opacity:1} 88%{top:88%;opacity:1} 100%{top:88%;opacity:0} }
  .cam-status { position:absolute; top:12px; left:0; right:0; display:flex; justify-content:center; z-index:10; }
  .status-pill { background:rgba(0,0,0,0.6); backdrop-filter:blur(8px); border-radius:20px; padding:5px 14px; font-size:12px; color:rgba(255,255,255,0.85); display:flex; align-items:center; gap:7px; }
  .status-dot { width:7px; height:7px; border-radius:50%; background:var(--accent); animation:pulse 1.4s infinite; }
  .status-dot.analyzing { background:#ff6b35; animation:none; }
  .status-dot.paused { background:var(--muted); animation:none; }
  @keyframes pulse { 0%,100%{opacity:1}50%{opacity:0.25} }
  .scan-hint { position:absolute; bottom:14px; left:0; right:0; text-align:center; font-size:12px; color:rgba(255,255,255,0.4); pointer-events:none; }

  /* result panel slides up from bottom */
  .result-panel { position:absolute; bottom:0; left:0; right:0; background:rgba(10,10,15,0.94); backdrop-filter:blur(16px); border-radius:22px 22px 0 0; padding:14px 18px 32px; transform:translateY(100%); transition:transform 0.35s cubic-bezier(0.34,1.4,0.64,1); z-index:20; }
  .result-panel.show { transform:translateY(0); }
  .panel-handle { width:36px; height:4px; background:var(--border); border-radius:2px; margin:0 auto 14px; }
  .panel-food { font-size:16px; font-weight:700; margin-bottom:3px; }
  .panel-cal { font-family:'Bebas Neue',sans-serif; font-size:44px; color:var(--accent); line-height:1; }
  .panel-cal span { font-family:'Noto Sans KR'; font-size:14px; color:var(--muted); }
  .panel-macros { font-size:12px; color:var(--muted); margin:6px 0 14px; }
  .panel-btns { display:flex; gap:10px; }
  .btn-eat { flex:2; background:var(--accent); color:#000; border:none; border-radius:14px; padding:14px; font-size:14px; font-weight:700; cursor:pointer; font-family:'Noto Sans KR',sans-serif; }
  .btn-skip { flex:1; background:var(--surface2); color:var(--muted); border:1px solid var(--border); border-radius:14px; padding:14px; font-size:13px; cursor:pointer; font-family:'Noto Sans KR',sans-serif; }

  /* no-camera fallback */
  .no-cam { display:none; flex-direction:column; align-items:center; justify-content:center; height:calc(100vh - 96px); gap:14px; padding:30px; text-align:center; }
  .no-cam.show { display:flex; }
  .no-cam-icon { font-size:50px; }
  .no-cam-text { font-size:13px; color:var(--muted); line-height:1.7; }
  #fileInput { display:none; }
  .btn-gallery { background:var(--accent); color:#000; border:none; border-radius:14px; padding:12px 28px; font-size:14px; font-weight:700; cursor:pointer; font-family:'Noto Sans KR',sans-serif; }

  /* WEEKLY */
  .week-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; margin-bottom:16px; }
  .week-day { background:var(--surface); border-radius:10px; padding:8px 4px; text-align:center; }
  .week-day-label { font-size:10px; color:var(--muted); margin-bottom:6px; }
  .week-bar-wrap { height:56px; background:var(--surface2); border-radius:6px; position:relative; overflow:hidden; margin-bottom:4px; }
  .week-bar { position:absolute; bottom:0; width:100%; border-radius:6px 6px 0 0; transition:height 0.4s ease; }
  .week-cal { font-size:9px; color:var(--muted); }
  .week-today .week-day-label { color:var(--accent); font-weight:700; }
  .week-summary { background:var(--surface); border-radius:16px; padding:16px; }
  .week-sum-row { display:flex; justify-content:space-between; align-items:center; padding:6px 0; border-bottom:1px solid var(--border); }
  .week-sum-row:last-child { border-bottom:none; }
  .week-sum-label { font-size:13px; color:var(--muted); }
  .week-sum-val { font-family:'Bebas Neue',sans-serif; font-size:18px; }

  /* SETTINGS */
  .goal-set-card { background:var(--surface); border-radius:20px; padding:20px; margin-bottom:16px; }
  .goal-set-title { font-size:15px; font-weight:700; margin-bottom:16px; }
  .input-row { margin-bottom:14px; }
  .input-label { font-size:12px; color:var(--muted); margin-bottom:6px; }
  .input-field { width:100%; background:var(--surface2); border:1px solid var(--border); border-radius:12px; padding:12px 14px; color:var(--text); font-size:15px; font-family:'Noto Sans KR',sans-serif; outline:none; }
  .input-field:focus { border-color:var(--accent); }
  .btn-save { width:100%; background:var(--accent); color:#000; border:none; border-radius:12px; padding:14px; font-size:14px; font-weight:700; cursor:pointer; font-family:'Noto Sans KR',sans-serif; }

  /* TOAST */
  .toast { position:fixed; bottom:30px; left:50%; transform:translateX(-50%) translateY(60px); background:var(--accent); color:#000; padding:10px 20px; border-radius:20px; font-size:13px; font-weight:700; transition:transform 0.3s ease; z-index:999; white-space:nowrap; }
  .toast.show { transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div class="header">
  <div class="logo">KCAL</div>
  <div class="date-badge" id="todayDate"></div>
</div>
<div class="tabs">
  <div class="tab active" onclick="switchTab('today')">오늘</div>
  <div class="tab" onclick="switchTab('scan')">스캔</div>
  <div class="tab" onclick="switchTab('weekly')">주간</div>
  <div class="tab" onclick="switchTab('settings')">설정</div>
</div>

<!-- TODAY -->
<div class="page active" id="page-today">
  <div class="goal-section">
    <div class="ring-wrap">
      <svg class="ring-svg" viewBox="0 0 100 100">
        <circle class="ring-bg" cx="50" cy="50" r="40"/>
        <circle class="ring-fill" id="ringFill" cx="50" cy="50" r="40" stroke-dasharray="251.3" stroke-dashoffset="251.3" stroke="var(--accent)"/>
      </svg>
      <div class="ring-center">
        <div class="ring-cal" id="ringCal">0</div>
        <div class="ring-label">kcal</div>
      </div>
    </div>
    <div class="goal-info">
      <div class="goal-title">오늘 섭취 칼로리</div>
      <div class="goal-numbers" id="todayTotal">0</div>
      <div class="goal-sub">목표: <span id="goalDisplay">2000</span> kcal</div>
      <div id="statusBadge"></div>
    </div>
  </div>
  <div class="macros">
    <div class="macro-card"><div class="macro-val" id="macroCarb" style="color:#c8f135">0g</div><div class="macro-lbl">탄수화물</div></div>
    <div class="macro-card"><div class="macro-val" id="macroProtein" style="color:#ff6b35">0g</div><div class="macro-lbl">단백질</div></div>
    <div class="macro-card"><div class="macro-val" id="macroFat" style="color:#a78bfa">0g</div><div class="macro-lbl">지방</div></div>
  </div>
  <div class="section-title">오늘 먹은 음식</div>
  <div id="foodLog"></div>
</div>

<!-- SCAN -->
<div class="page" id="page-scan">
  <div class="live-wrap" id="liveWrap">
    <video id="liveVideo" autoplay playsinline muted></video>
    <canvas id="snapCanvas"></canvas>
    <div class="scan-frame">
      <div class="sf-tl"></div><div class="sf-tr"></div>
      <div class="sf-bl"></div><div class="sf-br"></div>
      <div class="scan-line"></div>
    </div>
    <div class="cam-status">
      <div class="status-pill">
        <div class="status-dot" id="statusDot"></div>
        <span id="statusText">음식을 화면에 비춰주세요</span>
      </div>
    </div>
    <div class="scan-hint">프레임 안에 음식을 맞춰주세요 • 자동 인식</div>
    <div class="result-panel" id="resultPanel">
      <div class="panel-handle"></div>
      <div class="panel-food" id="panelFood"></div>
      <div class="panel-cal" id="panelCal">0 <span>kcal</span></div>
      <div class="panel-macros" id="panelMacros"></div>
      <div class="panel-btns">
        <button class="btn-eat" onclick="eatFood()">✅ 먹었어요 — 저장</button>
        <button class="btn-skip" onclick="skipFood()">❌ 안 먹어요</button>
      </div>
    </div>
  </div>
  <div class="no-cam" id="noCam">
    <div class="no-cam-icon">📷</div>
    <div class="no-cam-text">카메라를 사용할 수 없어요.<br>사진을 직접 선택해주세요.</div>
    <button class="btn-gallery" onclick="document.getElementById('fileInput').click()">갤러리에서 선택</button>
    <input type="file" id="fileInput" accept="image/*" onchange="handleFile(event)">
    <div id="fallbackResult"></div>
  </div>
</div>

<!-- WEEKLY -->
<div class="page" id="page-weekly">
  <div class="section-title" style="margin-bottom:14px">이번 주 칼로리</div>
  <div class="week-grid" id="weekGrid"></div>
  <div class="week-summary" id="weekSummary"></div>
</div>

<!-- SETTINGS -->
<div class="page" id="page-settings">
  <div class="goal-set-card">
    <div class="goal-set-title">목표 칼로리 설정</div>
    <div class="input-row">
      <div class="input-label">하루 목표 칼로리 (kcal)</div>
      <input class="input-field" type="number" id="goalInput" placeholder="예: 2000" min="500" max="5000">
    </div>
    <div class="input-row">
      <div class="input-label">이름 (선택)</div>
      <input class="input-field" type="text" id="nameInput" placeholder="예: 환익">
    </div>
    <button class="btn-save" onclick="saveSettings()">저장하기</button>
  </div>
  <div class="goal-set-card">
    <div class="goal-set-title">오늘 식단 초기화</div>
    <button class="btn-save" style="background:var(--danger);color:#fff" onclick="clearToday()">오늘 기록 삭제</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ← 여기에 본인 API 키 입력
let pendingFood = null;
let scanInterval = null;
let isAnalyzing = false;
let scanActive = false;
let stream = null;

// ─── STORAGE ──────────────────────────────────────────
const todayKey = () => 'kcal_' + new Date().toISOString().split('T')[0];
const getSettings = () => JSON.parse(localStorage.getItem('kcal_settings') || '{"goal":2000,"name":""}');
const saveSettingsData = d => localStorage.setItem('kcal_settings', JSON.stringify(d));
const getTodayLog = () => JSON.parse(localStorage.getItem(todayKey()) || '[]');
const saveTodayLog = l => localStorage.setItem(todayKey(), JSON.stringify(l));
const getDateLog = ds => JSON.parse(localStorage.getItem('kcal_' + ds) || '[]');

// ─── INIT ─────────────────────────────────────────────
function init() {
  const s = getSettings();
  document.getElementById('goalInput').value = s.goal;
  document.getElementById('nameInput').value = s.name || '';
  document.getElementById('goalDisplay').textContent = s.goal;
  document.getElementById('todayDate').textContent =
    new Date().toLocaleDateString('ko-KR', {month:'long', day:'numeric', weekday:'short'});
  renderToday();
}

// ─── TODAY ────────────────────────────────────────────
function renderToday() {
  const log = getTodayLog(), s = getSettings();
  const total   = log.reduce((a,f)=>a+f.cal,0);
  const carb    = log.reduce((a,f)=>a+(f.carb||0),0);
  const protein = log.reduce((a,f)=>a+(f.protein||0),0);
  const fat     = log.reduce((a,f)=>a+(f.fat||0),0);

  document.getElementById('todayTotal').textContent = total.toLocaleString();
  document.getElementById('ringCal').textContent = total>999?(total/1000).toFixed(1)+'k':total;
  document.getElementById('macroCarb').textContent = carb+'g';
  document.getElementById('macroProtein').textContent = protein+'g';
  document.getElementById('macroFat').textContent = fat+'g';

  const fill = document.getElementById('ringFill');
  fill.style.strokeDashoffset = 251.3*(1-Math.min(total/s.goal,1));
  fill.style.stroke = total>s.goal?'var(--danger)':'var(--accent)';

  const remain = s.goal - total;
  document.getElementById('statusBadge').innerHTML = total===0?'':
    total>s.goal
      ? `<span class="over-badge">+${Math.abs(remain)} kcal 초과</span>`
      : `<span class="ok-badge">${remain} kcal 남음</span>`;

  const el = document.getElementById('foodLog');
  if (!log.length) { el.innerHTML='<div class="empty-log">📭 아직 기록된 음식이 없어요</div>'; return; }
  const emojis = ['🍚','🍗','🥗','🍜','🍱','🥩','🥪','🍎','🥛','🍳','🍕','🍔'];
  el.innerHTML = log.slice().reverse().map((f,i)=>`
    <div class="food-item">
      <div class="food-emoji">${emojis[i%emojis.length]}</div>
      <div class="food-info"><div class="food-name">${f.name}</div><div class="food-time">${f.time}</div></div>
      <div><div class="food-cal">${f.cal}</div><div class="food-kcal">kcal</div></div>
      <button class="btn-del" onclick="deleteFood(${log.length-1-i})">✕</button>
    </div>`).join('');
}

function deleteFood(idx) {
  const log=getTodayLog(); log.splice(idx,1); saveTodayLog(log);
  renderToday(); renderWeekly(); showToast('삭제했어요');
}

// ─── LIVE CAMERA ──────────────────────────────────────
async function startCamera() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode:'environment', width:{ideal:1280}, height:{ideal:720} }
    });
    document.getElementById('liveVideo').srcObject = stream;
    document.getElementById('liveWrap').style.display = 'block';
    document.getElementById('noCam').classList.remove('show');
    scanActive = true;
    startScanLoop();
  } catch(e) {
    document.getElementById('liveWrap').style.display = 'none';
    document.getElementById('noCam').classList.add('show');
  }
}

function stopCamera() {
  scanActive = false;
  clearInterval(scanInterval);
  if (stream) { stream.getTracks().forEach(t=>t.stop()); stream=null; }
}

function startScanLoop() {
  clearInterval(scanInterval);
  scanInterval = setInterval(async () => {
    if (!scanActive || isAnalyzing) return;
    if (document.getElementById('resultPanel').classList.contains('show')) return;
    await captureAndAnalyze();
  }, 4000);
}

async function captureAndAnalyze() {
  const video = document.getElementById('liveVideo');
  if (!video.videoWidth) return;
  isAnalyzing = true;
  setStatus('analyzing','분석 중...');

  const canvas = document.getElementById('snapCanvas');
  canvas.width = video.videoWidth; canvas.height = video.videoHeight;
  canvas.getContext('2d').drawImage(video,0,0);
  const base64 = canvas.toDataURL('image/jpeg',0.8).split(',')[1];

  try {
    const res = await fetch("https://api.anthropic.com/v1/messages",{
      method:"POST", headers:{"Content-Type":"application/json","x-api-key":"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","anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
      body: JSON.stringify({
        model:"claude-sonnet-4-20250514", max_tokens:300,
        messages:[{role:"user",content:[
          {type:"image",source:{type:"base64",media_type:"image/jpeg",data:base64}},
          {type:"text",text:`음식 사진. JSON만 출력(마크다운 없이):
{"found":true또는false,"name":"음식이름","cal":칼로리정수,"carb":탄수화물g정수,"protein":단백질g정수,"fat":지방g정수}
음식이 없으면 found:false. 여러 음식이면 합산.`}
        ]}]
      })
    });
    const data = await res.json();
    if (data.error) { setStatus('scanning','API 오류: '+data.error.message); isAnalyzing=false; return; }
    const text = data.content.map(c=>c.text||'').join('').replace(/```json|```/g,'').trim();
    let food;
    try { food = JSON.parse(text); } catch(pe) { setStatus('scanning','인식 재시도 중...'); isAnalyzing=false; return; }

    if (food.found && food.cal > 0) {
      pendingFood = {...food, time:new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})};
      document.getElementById('panelFood').textContent = food.name;
      document.getElementById('panelCal').innerHTML = `${food.cal} <span>kcal</span>`;
      document.getElementById('panelMacros').textContent =
        `탄수화물 ${food.carb}g · 단백질 ${food.protein}g · 지방 ${food.fat}g`;
      document.getElementById('resultPanel').classList.add('show');
      setStatus('paused', food.name + ' 인식됨');
    } else {
      setStatus('scanning','음식을 화면에 비춰주세요');
    }
  } catch(e) {
    setStatus('scanning','연결 오류 — 재시도 중...');
    console.error('Scan error:', e);
  }
  isAnalyzing = false;
}

function eatFood() {
  if (!pendingFood) return;
  const log=getTodayLog(); log.push(pendingFood); saveTodayLog(log);
  renderToday(); renderWeekly();
  showToast(`${pendingFood.name} 기록됐어요 ✓`);
  pendingFood=null;
  document.getElementById('resultPanel').classList.remove('show');
  setStatus('scanning','음식을 화면에 비춰주세요');
  switchTab('today');
}

function skipFood() {
  pendingFood=null;
  document.getElementById('resultPanel').classList.remove('show');
  setStatus('scanning','음식을 화면에 비춰주세요');
  showToast('기록하지 않았어요');
}

function setStatus(type,text) {
  const dot=document.getElementById('statusDot');
  dot.className='status-dot'+(type==='analyzing'?' analyzing':type==='paused'?' paused':'');
  document.getElementById('statusText').textContent=text;
}

// fallback gallery
function handleFile(e) {
  const file=e.target.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=async ev=>{
    const base64=ev.target.result.split(',')[1];
    const fr=document.getElementById('fallbackResult');
    fr.innerHTML='<div style="color:var(--muted);font-size:13px;padding:10px 0">분석 중...</div>';
    try {
      const res=await fetch("https://api.anthropic.com/v1/messages",{
        method:"POST",headers:{"Content-Type":"application/json","x-api-key":"YOUR_API_KEY_HERE","anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
        body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:300,
          messages:[{role:"user",content:[
            {type:"image",source:{type:"base64",media_type:"image/jpeg",data:base64}},
            {type:"text",text:`JSON만:{"found":true또는false,"name":"음식이름","cal":칼로리정수,"carb":탄수화물g,"protein":단백질g,"fat":지방g}`}
          ]}]
        })
      });
      const data=await res.json();
      const food=JSON.parse(data.content.map(c=>c.text||'').join('').replace(/```json|```/g,'').trim());
      if(food.found){
        pendingFood={...food,time:new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})};
        fr.innerHTML=`<div style="background:var(--surface);border-radius:16px;padding:16px;width:100%;margin-top:12px">
          <div style="font-size:15px;font-weight:700;margin-bottom:4px">${food.name}</div>
          <div style="font-family:'Bebas Neue',sans-serif;font-size:36px;color:var(--accent);line-height:1">${food.cal}<span style="font-family:'Noto Sans KR';font-size:13px;color:var(--muted)"> kcal</span></div>
          <div style="font-size:12px;color:var(--muted);margin:6px 0 12px">탄수화물 ${food.carb}g · 단백질 ${food.protein}g · 지방 ${food.fat}g</div>
          <div style="display:flex;gap:8px">
            <button onclick="eatFood()" style="flex:2;background:var(--accent);color:#000;border:none;border-radius:12px;padding:12px;font-size:13px;font-weight:700;cursor:pointer;font-family:'Noto Sans KR',sans-serif">✅ 먹었어요</button>
            <button onclick="skipFood();document.getElementById('fallbackResult').innerHTML=''" style="flex:1;background:var(--surface2);color:var(--muted);border:1px solid var(--border);border-radius:12px;padding:12px;font-size:12px;cursor:pointer;font-family:'Noto Sans KR',sans-serif">❌ 안 먹어요</button>
          </div></div>`;
      } else {
        fr.innerHTML='<div style="color:var(--muted);font-size:13px;padding:8px 0">음식을 인식하지 못했어요</div>';
      }
    } catch(err){fr.innerHTML='<div style="color:var(--danger);font-size:13px;padding:8px 0">분석 실패</div>';}
  };
  reader.readAsDataURL(file);
}

// ─── WEEKLY ───────────────────────────────────────────
function renderWeekly() {
  const s=getSettings(), days=['일','월','화','수','목','금','토'], today=new Date();
  let wd=[];
  for(let i=6;i>=0;i--){
    const d=new Date(today); d.setDate(today.getDate()-i);
    const ds=d.toISOString().split('T')[0];
    wd.push({day:days[d.getDay()],cal:getDateLog(ds).reduce((a,f)=>a+f.cal,0),isToday:i===0});
  }
  const maxCal=Math.max(...wd.map(d=>d.cal),s.goal);
  document.getElementById('weekGrid').innerHTML=wd.map(d=>{
    const h=d.cal>0?Math.max((d.cal/maxCal)*48,4):0;
    const color=d.cal>s.goal?'var(--danger)':'var(--accent)';
    const cs=d.cal>=1000?(d.cal/1000).toFixed(1)+'k':d.cal||'-';
    return `<div class="week-day ${d.isToday?'week-today':''}">
      <div class="week-day-label">${d.day}</div>
      <div class="week-bar-wrap"><div class="week-bar" style="height:${h}px;background:${color}"></div></div>
      <div class="week-cal">${cs}</div></div>`;
  }).join('');
  const total=wd.reduce((a,d)=>a+d.cal,0);
  const avg=Math.round(total/7);
  const active=wd.filter(d=>d.cal>0).length;
  const over=wd.filter(d=>d.cal>s.goal).length;
  document.getElementById('weekSummary').innerHTML=`
    <div class="week-sum-row"><div class="week-sum-label">이번 주 총 칼로리</div><div class="week-sum-val">${total.toLocaleString()} kcal</div></div>
    <div class="week-sum-row"><div class="week-sum-label">일평균 칼로리</div><div class="week-sum-val">${avg.toLocaleString()} kcal</div></div>
    <div class="week-sum-row"><div class="week-sum-label">기록한 날</div><div class="week-sum-val">${active}일</div></div>
    <div class="week-sum-row"><div class="week-sum-label">목표 초과한 날</div><div class="week-sum-val" style="color:${over>0?'var(--danger)':'var(--success)'}">${over}일</div></div>`;
}

// ─── SETTINGS ─────────────────────────────────────────
function saveSettings() {
  const goal=parseInt(document.getElementById('goalInput').value)||2000;
  const name=document.getElementById('nameInput').value.trim();
  saveSettingsData({goal,name});
  document.getElementById('goalDisplay').textContent=goal;
  renderToday(); renderWeekly(); showToast('저장됐어요 ✓');
}
function clearToday() {
  if(!confirm('오늘 기록을 모두 삭제할까요?')) return;
  localStorage.removeItem(todayKey());
  renderToday(); renderWeekly(); showToast('초기화됐어요');
}

// ─── TAB ──────────────────────────────────────────────
function switchTab(name) {
  const names=['today','scan','weekly','settings'];
  document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',names[i]===name));
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById('page-'+name).classList.add('active');
  if (name==='scan' && !stream) startCamera();
  if (name!=='scan') stopCamera();
  if (name==='weekly') renderWeekly();
}

// ─── TOAST ────────────────────────────────────────────
let toastTimer;
function showToast(msg) {
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),2500);
}

init();
</script>
